$kind: http-request
name: PM-07 GET /api/config without session header
url: "{{baseUrl}}/api/config"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 400', () => pm.response.to.have.status(400));
      pm.test('Header message returned', () => pm.expect(pm.response.json().detail).to.include('X-Session-Id'));
    language: text/javascript
order: 7000
