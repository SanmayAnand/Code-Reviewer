$kind: http-request
name: PM-08 GET /api/history
url: "{{baseUrl}}/api/history"
method: GET
headers:
  X-Session-Id: "{{sessionId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('List contains the new review', () => {
        const ids = pm.response.json().items.map(i => i.id);
        pm.expect(ids).to.include(pm.collectionVariables.get('historyId'));
      });
    language: text/javascript
order: 8000
