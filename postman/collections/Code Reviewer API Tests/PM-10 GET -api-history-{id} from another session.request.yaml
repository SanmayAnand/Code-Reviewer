$kind: http-request
name: PM-10 GET /api/history/{id} from another session
url: "{{baseUrl}}/api/history/{{historyId}}"
method: GET
headers:
  X-Session-Id: other-session-0002
scripts:
  - type: afterResponse
    code: pm.test('Status is 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 10000
